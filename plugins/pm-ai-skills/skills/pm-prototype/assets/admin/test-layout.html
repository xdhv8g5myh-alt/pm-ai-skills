<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Admin 布局 Debug</title>
<link rel="stylesheet" href="../_公共资源/vendor/arco.css"/>
<link rel="stylesheet" href="../_公共资源/theme.css"/>
<style>
  [v-cloak] { display:none }
  #log { position:fixed; top:0; right:0; background:rgba(0,0,0,.8); color:#0f0; font:12px/1.6 monospace; padding:8px 12px; max-width:300px; z-index:9999; }
  .ok { color:#0f0 }
  .err { color:#f44; font-weight:bold }
</style>
</head>
<body>
<div id="log">加载中...</div>
<div id="app" v-cloak>
  <aside class="pro-sider" :style="{ width: collapsed ? '48px' : '220px' }">
    <div class="pro-brand">
      <div class="pro-brand-icon">⚡</div>
      <span v-show="!collapsed" class="pro-brand-name">测试系统</span>
    </div>
    <arco-menu :collapsed="collapsed" :selected-keys="['home']" style="border:none;width:100%">
      <arco-menu-item key="home">
        <template #icon><icon-home/></template>
        <a href="#">首页</a>
      </arco-menu-item>
      <arco-sub-menu key="sub">
        <template #icon><icon-apps/></template>
        <template #title>业务管理</template>
        <arco-menu-item key="list">列表</arco-menu-item>
      </arco-sub-menu>
    </arco-menu>
  </aside>
  <header class="pro-navbar" :style="{ left: collapsed ? '48px' : '220px' }">
    <arco-button type="text" @click="collapsed=!collapsed">折叠/展开</arco-button>
    <span style="font-size:14px">Admin 布局测试 - 如果你能看到这行字说明成功了</span>
  </header>
  <main class="pro-main" :style="{ marginLeft: collapsed ? '48px' : '220px' }">
    <div class="pro-content">
      <arco-card class="general-card">
        <p>✅ 布局渲染成功！collapsed={{ collapsed }}</p>
        <arco-button type="primary" @click="collapsed=!collapsed">切换侧边栏</arco-button>
      </arco-card>
    </div>
  </main>
</div>

<script src="../_公共资源/vendor/vue.global.prod.js"></script>
<script src="../_公共资源/vendor/arco-vue.min.js"></script>
<script>
const log = document.getElementById('log');
try {
  const { createApp, ref } = Vue;
  const app = createApp({
    setup() {
      const collapsed = ref(false);
      return { collapsed };
    }
  });
  app.use(ArcoVue);
  app.config.errorHandler = (err, vm, info) => {
    log.innerHTML = '<span class="err">❌ Vue错误:<br>' + err.message + '<br>' + info + '</span>';
    console.error(err);
  };
  app.config.warnHandler = (msg) => {
    log.innerHTML += '<br><span style="color:orange">⚠ ' + msg.slice(0,80) + '</span>';
  };
  app.mount('#app');
  log.innerHTML = '<span class="ok">✅ mount成功</span>';
} catch(e) {
  log.innerHTML = '<span class="err">❌ ' + e.message + '</span>';
}
</script>
</body>
</html>
