<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>左筛右表 · 管理后台</title>
<link rel="stylesheet" href="../_shared/vendor/arco.css"/>
<link rel="stylesheet" href="../_shared/theme.css"/>
<style>
  [v-cloak] { display:none }
</style>
</head>
<body>
<div id="app" v-cloak>
  <!-- 左侧边栏 -->
  <aside class="pro-sider" :style="{ width: collapsed ? '48px' : '220px' }">
    <div class="pro-brand">
      <div class="pro-brand-icon">⚡</div>
      <span v-show="!collapsed" class="pro-brand-name">管理系统</span>
    </div>
    <a-menu
      :collapsed="collapsed"
      :selected-keys="selectedKeys"
      :open-keys="openKeys"
      @menu-item-click="onMenuClick"
      @sub-menu-click="onSubMenuClick"
      style="border:none;width:100%;flex:1"
    >
      <a-menu-item key="dashboard">
        <template #icon><icon-home></icon-home></template>
        <a href="./dashboard.html">数据概览</a>
      </a-menu-item>
      <a-sub-menu key="list-group">
        <template #icon><icon-apps></icon-apps></template>
        <template #title>业务管理</template>
        <a-menu-item key="list"><a href="./list.html">数据列表</a></a-menu-item>
        <a-menu-item key="list-kanban"><a href="./list-kanban.html">任务看板</a></a-menu-item>
        <a-menu-item key="list-calendar"><a href="./list-calendar.html">日历视图</a></a-menu-item>
        <a-menu-item key="list-tree-table"><a href="./list-tree-table.html">左树右表</a></a-menu-item>
        <a-menu-item key="list-filter-table"><a href="./list-filter-table.html">左筛右表</a></a-menu-item>
        <a-menu-item key="list-inline-edit"><a href="./list-inline-edit.html">行内编辑</a></a-menu-item>
        <a-menu-item key="file-manager"><a href="./file-manager.html">文件管理</a></a-menu-item>
        <a-menu-item key="wizard-import"><a href="./wizard-import.html">导入向导</a></a-menu-item>
        <a-menu-item key="form-add"><a href="./form-add.html">新增数据</a></a-menu-item>
        <a-menu-item key="detail"><a href="./detail.html">数据详情</a></a-menu-item>
      </a-sub-menu>
      <a-sub-menu key="system">
        <template #icon><icon-settings></icon-settings></template>
        <template #title>系统管理</template>
        <a-menu-item key="user-mgmt">用户管理</a-menu-item>
        <a-menu-item key="role-mgmt">角色权限</a-menu-item>
        <a-menu-item key="log">操作日志</a-menu-item>
      </a-sub-menu>
      <a-menu-item key="help">
        <template #icon><icon-question-circle></icon-question-circle></template>
        帮助中心
      </a-menu-item>
    </a-menu>
  </aside>

  <!-- 顶部导航栏 -->
  <header class="pro-navbar" :style="{ left: collapsed ? '48px' : '220px' }">
    <div style="display:flex;align-items:center;gap:12px">
      <a-button type="text" style="color:var(--color-text-2)" @click="collapsed = !collapsed">
        <template #icon>
          <icon-menu-fold v-if="!collapsed"></icon-menu-fold>
          <icon-menu-unfold v-else></icon-menu-unfold>
        </template>
      </a-button>
      <a-breadcrumb>
        <a-breadcrumb-item>
          <a href="./dashboard.html" style="color:var(--color-text-3)">首页</a>
        </a-breadcrumb-item>
        <a-breadcrumb-item>业务管理</a-breadcrumb-item>
        <a-breadcrumb-item>{{ pageTitle }}</a-breadcrumb-item>
      </a-breadcrumb>
    </div>
    <div style="display:flex;align-items:center;gap:4px">
      <div style="display:flex;align-items:center;gap:8px;width:200px;height:32px;padding:0 12px;border:1px solid var(--proto-border);border-radius:20px;background:rgba(0,0,0,.04);color:var(--color-text-3);cursor:pointer;font-size:13px;margin-right:8px">
        <icon-search style="font-size:14px;flex-shrink:0"></icon-search>
        <span>搜索页面...</span>
      </div>
      <a-tooltip content="消息通知">
        <a-badge :count="noticeCount" :offset="[-2,4]">
          <a-button type="text" style="color:var(--color-text-2)">
            <template #icon><icon-notification style="font-size:18px"></icon-notification></template>
          </a-button>
        </a-badge>
      </a-tooltip>
      <a-tooltip content="全屏">
        <a-button type="text" style="color:var(--color-text-2)">
          <template #icon><icon-fullscreen style="font-size:18px"></icon-fullscreen></template>
        </a-button>
      </a-tooltip>
      <!-- 主题色选择 -->
      <div style="display:flex;align-items:center;gap:4px;padding:0 6px">
        <span
          v-for="t in themePresets" :key="t.key"
          :title="t.name"
          @click="applyTheme(t.key)"
          :style="{
            display:'inline-block', width:'14px', height:'14px',
            borderRadius:'50%', background:t.color, cursor:'pointer',
            boxShadow: themeKey===t.key ? '0 0 0 2px #fff,0 0 0 4px '+t.color : 'none',
            transition:'box-shadow .15s'
          }"
        ></span>
      </div>

      <a-tooltip :content="isDark ? '切换浅色' : '切换深色'">
        <a-button type="text" style="color:var(--color-text-2);font-size:16px;padding:0 8px;line-height:1" @click="toggleTheme">
          {{ isDark ? '☀️' : '🌙' }}
        </a-button>
      </a-tooltip>
      <a-divider direction="vertical" style="height:20px;margin:0 8px"></a-divider>
      <a-dropdown trigger="click">
        <div style="display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 8px;border-radius:6px;transition:.15s" onmouseenter="this.style.background='rgba(0,0,0,.04)'" onmouseleave="this.style.background=''">
          <a-avatar style="background:linear-gradient(135deg,#165dff,#7b61ff);font-size:14px" :size="32">管</a-avatar>
          <span style="font-size:14px;color:var(--color-text-1)">管理员</span>
          <icon-down style="font-size:12px;color:var(--color-text-3)"></icon-down>
        </div>
        <template #content>
          <a-doption>个人信息</a-doption>
          <a-doption>修改密码</a-doption>
          <a-doption disabled>系统设置</a-doption>
          <a-divider style="margin:4px 0"></a-divider>
          <a-doption><a href="./login.html" style="color:inherit">退出登录</a></a-doption>
        </template>
      </a-dropdown>
    </div>
  </header>

  <!-- 主内容区 -->
  <main class="pro-main" :style="{ marginLeft: collapsed ? '48px' : '220px' }">
    <div class="pro-content">

      <!-- loading 态 -->
      <div v-if="pageState === 'loading'" style="display:flex;align-items:center;justify-content:center;min-height:400px">
        <a-spin tip="加载中..." :size="32"></a-spin>
      </div>

      <!-- error 态 -->
      <a-result v-else-if="pageState === 'error'" status="500" title="加载失败" subtitle="请求数据时出现错误，请稍后重试" style="padding:80px 0">
        <template #extra>
          <a-button type="primary" @click="pageState='normal'">重新加载</a-button>
        </template>
      </a-result>

      <!-- empty 态 -->
      <a-card v-else-if="pageState === 'empty'" class="general-card" style="padding:60px 0;text-align:center">
        <a-empty description="暂无数据" style="padding:40px 0">
          <template #extra>
            <a-button type="primary">刷新数据</a-button>
          </template>
        </a-empty>
      </a-card>

      <!-- 正常内容 -->
      <template v-else>

        <div style="display:flex;gap:16px;align-items:flex-start">
          <!-- 左侧筛选面板 -->
          <div class="filter-panel">
            <div class="filter-panel-title">筛选条件</div>

            <!-- 状态筛选 -->
            <div class="filter-group">
              <div class="filter-label">状态</div>
              <a-checkbox-group v-model="filters.status" style="display:flex;flex-direction:column">
                <a-checkbox value="active">
                  <span class="filter-option">
                    <span style="width:8px;height:8px;border-radius:50%;background:#00b42a"></span>
                    正常（48）
                  </span>
                </a-checkbox>
                <a-checkbox value="pending">
                  <span class="filter-option">
                    <span style="width:8px;height:8px;border-radius:50%;background:#ff7d00"></span>
                    待审核（12）
                  </span>
                </a-checkbox>
                <a-checkbox value="disabled">
                  <span class="filter-option">
                    <span style="width:8px;height:8px;border-radius:50%;background:#86909c"></span>
                    已禁用（6）
                  </span>
                </a-checkbox>
                <a-checkbox value="deleted">
                  <span class="filter-option">
                    <span style="width:8px;height:8px;border-radius:50%;background:#f53f3f"></span>
                    已删除（3）
                  </span>
                </a-checkbox>
              </a-checkbox-group>
            </div>

            <a-divider style="margin:0 0 16px"></a-divider>

            <!-- 日期范围 -->
            <div class="filter-group">
              <div class="filter-label">创建时间</div>
              <a-select v-model="filters.dateRange" placeholder="选择时间范围" style="width:100%" allow-clear>
                <a-option value="today">今天</a-option>
                <a-option value="7d">近 7 天</a-option>
                <a-option value="30d">近 30 天</a-option>
                <a-option value="90d">近 90 天</a-option>
                <a-option value="custom">自定义范围</a-option>
              </a-select>
            </div>

            <!-- 标签 -->
            <div class="filter-group">
              <div class="filter-label">标签</div>
              <div style="display:flex;flex-wrap:wrap;gap:6px">
                <a-tag
                  v-for="tag in tagOptions"
                  :key="tag"
                  :color="filters.tags.includes(tag) ? arcoblue : ''"
                  :style="{ cursor:'pointer' }"
                  @click="toggleTag(tag)"
                >{{ tag }}</a-tag>
              </div>
            </div>

            <!-- 部门 -->
            <div class="filter-group">
              <div class="filter-label">部门</div>
              <a-select v-model="filters.dept" placeholder="全部部门" style="width:100%" allow-clear>
                <a-option value="">全部部门</a-option>
                <a-option value="tech">技术部</a-option>
                <a-option value="product">产品部</a-option>
                <a-option value="design">设计部</a-option>
                <a-option value="ops">运营部</a-option>
                <a-option value="market">市场部</a-option>
              </a-select>
            </div>

            <a-divider style="margin:0 0 16px"></a-divider>

            <div style="display:flex;flex-direction:column;gap:8px">
              <a-button type="primary" long>查询</a-button>
              <a-button long @click="resetFilters">重置筛选</a-button>
            </div>
          </div>

          <!-- 右侧表格 -->
          <a-card class="general-card" :body-style="{ padding: '0' }" style="flex:1">
            <!-- 顶部搜索+操作 -->
            <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--proto-border)">
              <div style="display:flex;align-items:center;gap:12px">
                <div class="pro-block-title" style="margin:0">用户列表</div>
                <span style="font-size:12px;color:var(--color-text-3)">共 {{ tableData.length }} 条</span>
              </div>
              <a-space>
                <a-input placeholder="搜索用户" allow-clear style="width:200px">
                  <template #prefix><icon-search></icon-search></template>
                </a-input>
                <a-button type="primary">
                  <template #icon><icon-plus></icon-plus></template>
                  新增
                </a-button>
                <a-button>
                  <template #icon><icon-export></icon-export></template>
                  导出
                </a-button>
              </a-space>
            </div>

            <!-- 表格 -->
            <a-table :data="tableData" :pagination="false" :bordered="false" :row-selection="{ type: 'checkbox', showCheckedAll: true }">
              <template #columns>
                <a-table-column title="ID" data-index="id" :width="80"></a-table-column>
                <a-table-column title="用户名" data-index="name"></a-table-column>
                <a-table-column title="部门" data-index="dept">
                  <template #cell="{ record }">
                    <a-tag size="small">{{ record.dept }}</a-tag>
                  </template>
                </a-table-column>
                <a-table-column title="标签" data-index="tags">
                  <template #cell="{ record }">
                    <a-tag v-for="t in record.tags" :key="t" size="small" style="margin-right:4px">{{ t }}</a-tag>
                  </template>
                </a-table-column>
                <a-table-column title="状态" data-index="status">
                  <template #cell="{ record }">
                    <a-tag
                      :color="record.status === '正常' ? 'green' : record.status === '待审核' ? 'orange' : 'red'"
                    >{{ record.status }}</a-tag>
                  </template>
                </a-table-column>
                <a-table-column title="注册时间" data-index="createdAt" :width="170"></a-table-column>
                <a-table-column title="操作" :width="150" fixed="right">
                  <template #cell="{ record }">
                    <a-space>
                      <a-button type="text" size="small">详情</a-button>
                      <a-button type="text" size="small">编辑</a-button>
                    </a-space>
                  </template>
                </a-table-column>
              </template>
            </a-table>

            <!-- 分页 -->
            <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-top:1px solid var(--proto-border)">
              <span style="font-size:13px;color:var(--color-text-3)">已选 0 条</span>
              <a-pagination :total="tableData.length" :page-size="10" :current="1" show-total show-jumper></a-pagination>
            </div>
          </a-card>
        </div>

      </template>
    </div>
  </main>

  <!-- 原型调试工具条 -->
  <div class="proto-toolbar">
    <span class="proto-badge">PROTO</span>
    <span style="color:rgba(255,255,255,.5)">管理后台</span>
    <span class="proto-sep">·</span>
    <span>{{ pageTitle }}</span>
    <span class="proto-sep">|</span>
    <button @click="setPageState('loading')">⏳ 加载中</button>
    <button @click="setPageState('empty')">📭 空数据</button>
    <button @click="setPageState('error')">⚠️ 出错</button>
    <button @click="setPageState('normal')">✅ 正常</button>
    <span class="proto-sep">|</span>
    <span style="opacity:.4;font-size:11px">仅原型调试用</span>
  </div>
</div>

<script src="../_shared/vendor/vue.global.prod.js"></script>
<script src="../_shared/vendor/arco-vue.min.js"></script>
<script src="../_shared/proto-utils.js"></script>
<script>
const { createApp, ref, reactive } = Vue

createApp({
  setup() {
    const collapsed    = ref(false)
    const selectedKeys = ref(['list-filter-table'])
    const openKeys     = ref(['list-group'])
    const pageTitle    = ref('左筛右表')
    const noticeCount  = ref(3)
    const pageState    = ref('normal')

    const filters = reactive({
      status: [],
      dateRange: '',
      tags: [],
      dept: '',
    })

    const tagOptions = ['VIP', '活跃用户', '新注册', '付费', '企业版', '个人版']

    function toggleTag(tag) {
      const idx = filters.tags.indexOf(tag)
      if (idx > -1) filters.tags.splice(idx, 1)
      else filters.tags.push(tag)
    }
    function resetFilters() {
      filters.status = []
      filters.dateRange = ''
      filters.tags = []
      filters.dept = ''
    }

    const tableData = ref([
      { id: 'U001', name: '张伟',   dept: '技术部', tags: ['VIP','付费'],   status: '正常',   createdAt: '2026-10-15 10:23' },
      { id: 'U002', name: '李芳',   dept: '产品部', tags: ['新注册'],         status: '待审核', createdAt: '2026-11-01 14:10' },
      { id: 'U003', name: '王磊',   dept: '运营部', tags: ['活跃用户'],       status: '正常',   createdAt: '2026-09-20 09:45' },
      { id: 'U004', name: '赵静',   dept: '市场部', tags: ['企业版','付费'], status: '正常',   createdAt: '2026-10-08 16:30' },
      { id: 'U005', name: '刘洋',   dept: '技术部', tags: ['个人版'],         status: '已禁用', createdAt: '2026-08-30 11:22' },
      { id: 'U006', name: '陈敏',   dept: '设计部', tags: ['VIP','活跃用户'], status: '正常',   createdAt: '2026-11-05 08:15' },
      { id: 'U007', name: '杨帆',   dept: '技术部', tags: ['新注册'],         status: '待审核', createdAt: '2026-11-10 17:40' },
      { id: 'U008', name: '周婷',   dept: '产品部', tags: ['付费','企业版'], status: '正常',   createdAt: '2026-10-28 13:05' },
      { id: 'U009', name: '吴昊',   dept: '运营部', tags: ['活跃用户'],       status: '正常',   createdAt: '2026-11-03 09:12' },
      { id: 'U010', name: '郑宇',   dept: '设计部', tags: ['个人版'],         status: '正常',   createdAt: '2026-10-22 15:50' },
    ])

    const isDark = ref(localStorage.getItem('proto-theme') === 'dark')
    function toggleTheme() {
      isDark.value = !isDark.value
      if (isDark.value) {
        document.body.setAttribute('arco-theme', 'dark')
        localStorage.setItem('proto-theme', 'dark')
      } else {
        document.body.removeAttribute('arco-theme')
        localStorage.setItem('proto-theme', 'light')
      }
    }
    if (isDark.value) document.body.setAttribute('arco-theme', 'dark')

    const THEMES = {
      blue:     { name:'品牌蓝', color:'#165dff', p1:'233 241 255', p5:'61 126 255',  p6:'22 93 255',   p7:'18 72 199'  },
      techBlue: { name:'科技蓝', color:'#4080ff', p1:'232 240 255', p5:'90 155 255',  p6:'64 128 255',  p7:'50 100 200' },
      green:    { name:'生机绿', color:'#00b42a', p1:'235 255 239', p5:'0 210 50',    p6:'0 180 42',    p7:'0 140 33'   },
      cyan:     { name:'清新青', color:'#0fc6c2', p1:'228 254 253', p5:'40 215 212',  p6:'15 198 194',  p7:'11 153 150' },
      orange:   { name:'活力橙', color:'#ff7d00', p1:'255 247 232', p5:'255 158 0',   p6:'255 125 0',   p7:'200 95 0'   },
    }
    const themePresets = Object.entries(THEMES).map(([key, v]) => ({ key, ...v }))
    const themeKey = ref(localStorage.getItem('proto-theme-color') || 'blue')

    function applyTheme(key) {
      const t = THEMES[key]; if (!t) return
      themeKey.value = key
      const r = document.documentElement
      r.style.setProperty('--primary-1', t.p1)
      r.style.setProperty('--primary-5', t.p5)
      r.style.setProperty('--primary-6', t.p6)
      r.style.setProperty('--primary-7', t.p7)
      localStorage.setItem('proto-theme-color', key)
    }
    applyTheme(themeKey.value)

    function setPageState(s) { pageState.value = s }

    const NAV_MAP = {
      dashboard: './dashboard.html', list: './list.html', 'form-add': './form-add.html',
      detail: './detail.html', 'list-filter': './list-filter.html', 'list-card': './list-card.html',
      'form-step': './form-step.html', profile: './profile.html', 'result-success': './result-success.html',
      'exception-404': './exception-404.html', 'user-role': './user-role.html',
      'permission-tree': './permission-tree.html', 'log-list': './log-list.html',
      'user-mgmt': './user-role.html', 'role-mgmt': './permission-tree.html',
      log: './log-list.html', help: './index.html',
      index: './index.html', login: './login.html',
      'list-kanban': './list-kanban.html', 'list-calendar': './list-calendar.html',
      'list-tree-table': './list-tree-table.html', 'list-filter-table': './list-filter-table.html',
      'list-inline-edit': './list-inline-edit.html', 'file-manager': './file-manager.html',
      'wizard-import': './wizard-import.html'
    }
    function onMenuClick(key) {
      selectedKeys.value = [key]
      if (NAV_MAP[key]) window.location.href = NAV_MAP[key]
    }
    function onSubMenuClick(key, openedKeys) { openKeys.value = openedKeys }

    window.__protoApp = { pageState }
    return {
      collapsed, selectedKeys, openKeys,
      pageTitle, noticeCount, pageState,
      filters, tagOptions, tableData,
      toggleTag, resetFilters,
      setPageState, onMenuClick, onSubMenuClick,
      isDark, toggleTheme,
      themePresets, themeKey, applyTheme
    }
  }
}).use(ArcoVue).mount('#app')
</script>
</body>
</html>
