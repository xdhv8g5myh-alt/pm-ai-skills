<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>角色权限 · 管理后台</title>
<link rel="stylesheet" href="../_公共资源/vendor/arco.css"/>
  <link rel="stylesheet" href="../_公共资源/vendor/fontawesome/css/fontawesome.min.css"/>
<link rel="stylesheet" href="../_公共资源/theme.css"/>
<style>
  [v-cloak] { display:none }
  .role-item { padding:10px 14px; border-radius:6px; cursor:pointer; transition:.15s; border:1px solid transparent; margin-bottom:4px; }
  .role-item:hover { background:var(--color-fill-2); }
  .role-item.active { background:#f0f5ff; border-color:#bedaff; }
  .role-item-name { font-weight:600; font-size:14px; color:var(--color-text-1); }
  .role-item.active .role-item-name { color:#165dff; }
  .role-item-desc { font-size:12px; color:var(--color-text-3); margin-top:2px; }
</style>
</head>
<body>
<div id="app" v-cloak>
  <!-- 左侧边栏 -->
  <aside class="pro-sider" :style="{ width: collapsed ? '48px' : '220px' }">
    <div class="pro-brand">
      <div class="pro-brand-icon"><span class="fas fa-bolt"></span></div>
      <span v-show="!collapsed" class="pro-brand-name">管理系统</span>
    </div>
    <a-menu
      :collapsed="collapsed"
      :selected-keys="selectedKeys"
      :open-keys="openKeys"
      @menu-item-click="onMenuClick"
      @sub-menu-click="onSubMenuClick"
      style="border:none;width:100%;flex:1"
    >
      <a-menu-item key="dashboard">
        <template #icon><icon-home></icon-home></template>
        <a href="./dashboard.html">数据概览</a>
      </a-menu-item>
      <a-sub-menu key="list-group">
        <template #icon><icon-apps></icon-apps></template>
        <template #title>业务管理</template>
        <a-menu-item key="list"><a href="./list.html">数据列表</a></a-menu-item>
        <a-menu-item key="form-add"><a href="./form-add.html">新增数据</a></a-menu-item>
        <a-menu-item key="detail"><a href="./detail.html">数据详情</a></a-menu-item>
      </a-sub-menu>
      <a-sub-menu key="system">
        <template #icon><icon-settings></icon-settings></template>
        <template #title>系统管理</template>
        <a-menu-item key="user-mgmt"><a href="./user-role.html">用户管理</a></a-menu-item>
        <a-menu-item key="role-mgmt"><a href="./permission-tree.html">角色权限</a></a-menu-item>
        <a-menu-item key="log"><a href="./log-list.html">操作日志</a></a-menu-item>
      </a-sub-menu>
      <a-menu-item key="help">
        <template #icon><icon-question-circle></icon-question-circle></template>
        帮助中心
      </a-menu-item>
    </a-menu>
  </aside>

  <!-- 顶部导航栏 -->
  <header class="pro-navbar" :style="{ left: collapsed ? '48px' : '220px' }">
    <div style="display:flex;align-items:center;gap:12px">
      <a-button type="text" style="color:var(--color-text-2)" @click="collapsed = !collapsed">
        <template #icon>
          <icon-menu-fold v-if="!collapsed"></icon-menu-fold>
          <icon-menu-unfold v-else></icon-menu-unfold>
        </template>
      </a-button>
      <a-breadcrumb>
        <a-breadcrumb-item>
          <a href="./dashboard.html" style="color:var(--color-text-3)">首页</a>
        </a-breadcrumb-item>
        <a-breadcrumb-item>系统管理</a-breadcrumb-item>
        <a-breadcrumb-item>{{ pageTitle }}</a-breadcrumb-item>
      </a-breadcrumb>
    </div>
    <div style="display:flex;align-items:center;gap:4px">
      <div style="display:flex;align-items:center;gap:8px;width:200px;height:32px;padding:0 12px;border:1px solid var(--proto-border);border-radius:20px;background:rgba(0,0,0,.04);color:var(--color-text-3);cursor:pointer;font-size:13px;margin-right:8px">
        <icon-search style="font-size:14px;flex-shrink:0"></icon-search>
        <span>搜索页面...</span>
      </div>
      <a-tooltip content="消息通知">
        <a-badge :count="noticeCount" :offset="[-2,4]">
          <a-button type="text" style="color:var(--color-text-2)">
            <template #icon><icon-notification style="font-size:18px"></icon-notification></template>
          </a-button>
        </a-badge>
      </a-tooltip>
      <a-tooltip content="全屏">
        <a-button type="text" style="color:var(--color-text-2)">
          <template #icon><icon-fullscreen style="font-size:18px"></icon-fullscreen></template>
        </a-button>
      </a-tooltip>
      <!-- 主题色选择 -->
      <div style="display:flex;align-items:center;gap:4px;padding:0 6px">
        <span
          v-for="t in themePresets" :key="t.key"
          :title="t.name"
          @click="applyTheme(t.key)"
          :style="{
            display:'inline-block', width:'14px', height:'14px',
            borderRadius:'50%', background:t.color, cursor:'pointer',
            boxShadow: themeKey===t.key ? '0 0 0 2px #fff,0 0 0 4px '+t.color : 'none',
            transition:'box-shadow .15s'
          }"
        ></span>
      </div>

      <a-tooltip :content="isDark ? '切换浅色' : '切换深色'">
        <a-button type="text" style="color:var(--color-text-2);font-size:16px;padding:0 8px;line-height:1" @click="toggleTheme">
          <i v-if="isDark" class="fas fa-sun"></i><i v-else class="fas fa-moon"></i>
        </a-button>
      </a-tooltip>
      <a-divider direction="vertical" style="height:20px;margin:0 8px"></a-divider>
      <a-dropdown trigger="click">
        <div style="display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 8px;border-radius:6px;transition:.15s" onmouseenter="this.style.background='rgba(0,0,0,.04)'" onmouseleave="this.style.background=''">
          <a-avatar style="background:linear-gradient(135deg,#165dff,#7b61ff);font-size:14px" :size="32">管</a-avatar>
          <span style="font-size:14px;color:var(--color-text-1)">管理员</span>
          <icon-down style="font-size:12px;color:var(--color-text-3)"></icon-down>
        </div>
        <template #content>
          <a-doption>个人信息</a-doption>
          <a-doption>修改密码</a-doption>
          <a-doption disabled>系统设置</a-doption>
          <a-divider style="margin:4px 0"></a-divider>
          <a-doption><a href="./login.html" style="color:inherit">退出登录</a></a-doption>
        </template>
      </a-dropdown>
    </div>
  </header>

  <!-- 主内容区 -->
  <main class="pro-main" :style="{ marginLeft: collapsed ? '48px' : '220px' }">
    <div class="pro-content">

      <!-- loading 态 -->
      <div v-if="pageState === 'loading'" style="display:flex;align-items:center;justify-content:center;min-height:400px">
        <a-spin tip="加载中..." :size="32"></a-spin>
      </div>

      <!-- error 态 -->
      <a-result v-else-if="pageState === 'error'" status="500" title="加载失败" subtitle="请求数据时出现错误，请稍后重试" style="padding:80px 0">
        <template #extra>
          <a-button type="primary" @click="pageState='normal'">重新加载</a-button>
        </template>
      </a-result>

      <!-- empty 态 -->
      <a-card v-else-if="pageState === 'empty'" class="general-card" style="padding:60px 0;text-align:center">
        <a-empty description="暂无角色数据" style="padding:40px 0"></a-empty>
      </a-card>

      <!-- 正常内容 -->
      <template v-else>
        <div style="display:flex;gap:16px;align-items:flex-start">

          <!-- 左侧角色列表 -->
          <a-card class="general-card" style="width:200px;flex-shrink:0" :body-style="{ padding: '12px' }">
            <div style="font-weight:600;font-size:13px;color:var(--color-text-2);padding:4px 4px 10px">角色列表</div>
            <div
              v-for="role in roles"
              :key="role.key"
              class="role-item"
              :class="{ active: activeRole === role.key }"
              @click="activeRole = role.key"
            >
              <div class="role-item-name">{{ role.name }}</div>
              <div class="role-item-desc">{{ role.desc }}</div>
            </div>
            <a-divider style="margin:10px 0"></a-divider>
            <a-button type="dashed" long size="small">
              <template #icon><icon-plus></icon-plus></template>
              新建角色
            </a-button>
          </a-card>

          <!-- 右侧权限树 -->
          <div style="flex:1;min-width:0">
            <a-card class="general-card" :body-style="{ padding: '20px 24px' }">
              <!-- 顶部操作行 -->
              <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px">
                <div>
                  <div style="font-size:16px;font-weight:700;color:var(--color-text-1);margin-bottom:4px">{{ currentRole.name }}</div>
                  <div style="font-size:13px;color:var(--color-text-3)">{{ currentRole.desc }}</div>
                </div>
                <a-space>
                  <a-button type="primary">
                    <template #icon><icon-check-circle></icon-check-circle></template>
                    保存修改
                  </a-button>
                  <a-button>
                    <template #icon><icon-refresh></icon-refresh></template>
                    重置
                  </a-button>
                </a-space>
              </div>

              <!-- 权限说明 -->
              <a-alert type="info" style="margin-bottom:16px" :show-icon="true">
                勾选对应权限节点以授予该角色访问权限，父节点勾选时自动勾选所有子权限。
              </a-alert>

              <!-- 权限树 -->
              <a-tree
                :data="permTree"
                checkable
                default-expand-all
                :default-checked-keys="checkedKeys"
                style="font-size:14px"
              ></a-tree>
            </a-card>
          </div>

        </div>
      </template>
    </div>
  </main>

  <!-- 原型调试工具条 -->
  <div class="proto-toolbar">
    <span class="proto-badge">PROTO</span>
    <span style="color:rgba(255,255,255,.5)">管理后台</span>
    <span class="proto-sep">·</span>
    <span>{{ pageTitle }}</span>
    <span class="proto-sep">|</span>
    <button @click="setPageState('loading')">⏳ 加载中</button>
    <button @click="setPageState('empty')">📭 空数据</button>
    <button @click="setPageState('error')"><span class="fas fa-triangle-exclamation"></span> 出错</button>
    <button @click="setPageState('normal')"><span class="fas fa-check"></span> 正常</button>
    <span class="proto-sep">|</span>
    <span style="opacity:.4;font-size:11px">仅原型调试用</span>
  </div>
</div>

<script src="../_公共资源/vendor/vue.global.prod.js"></script>
<script src="../_公共资源/vendor/arco-vue.min.js"></script>
<script src="../_公共资源/proto-utils.js"></script>
<script>
const { createApp, ref, computed } = Vue

createApp({
  setup() {
    const collapsed    = ref(false)
    const selectedKeys = ref(['role-mgmt'])
    const openKeys     = ref(['system'])
    const pageTitle    = ref('角色权限')
    const noticeCount  = ref(3)
    const pageState    = ref('normal')
    const activeRole   = ref('admin')

    const roles = [
      { key: 'super',  name: '超级管理员', desc: '拥有全部权限' },
      { key: 'admin',  name: '管理员',     desc: '日常管理权限' },
      { key: 'editor', name: '编辑者',     desc: '内容编辑权限' },
      { key: 'viewer', name: '查看者',     desc: '只读查看权限' },
    ]

    const currentRole = computed(() => roles.find(r => r.key === activeRole.value) || roles[0])

    const permTree = ref([
      { key: 'dashboard', title: '仪表盘' },
      {
        key: 'data-mgmt', title: '数据管理',
        children: [
          { key: 'data-list',   title: '列表查看' },
          { key: 'data-create', title: '新增数据' },
          { key: 'data-edit',   title: '编辑数据' },
          { key: 'data-delete', title: '删除数据' },
        ]
      },
      {
        key: 'user-mgmt', title: '用户管理',
        children: [
          { key: 'user-view',   title: '查看用户' },
          { key: 'user-edit',   title: '编辑用户' },
          { key: 'user-delete', title: '删除用户' },
          { key: 'user-perm',   title: '权限分配' },
        ]
      },
      {
        key: 'sys-settings', title: '系统设置',
        children: [
          { key: 'sys-basic',    title: '基础配置' },
          { key: 'sys-security', title: '安全设置' },
        ]
      },
    ])

    // 管理员默认勾选的权限（不含删除数据、删除用户、权限分配、系统设置）
    const checkedKeys = [
      'dashboard',
      'data-list', 'data-create', 'data-edit',
      'user-view', 'user-edit',
    ]

    const isDark = ref(localStorage.getItem('proto-theme') === 'dark')
    function toggleTheme() {
      isDark.value = !isDark.value
      if (isDark.value) {
        document.body.setAttribute('arco-theme', 'dark')
        localStorage.setItem('proto-theme', 'dark')
      } else {
        document.body.removeAttribute('arco-theme')
        localStorage.setItem('proto-theme', 'light')
      }
    }
    if (isDark.value) document.body.setAttribute('arco-theme', 'dark')

    const THEMES = {
      blue:     { name:'品牌蓝', color:'#165dff', p1:'233 241 255', p5:'61 126 255',  p6:'22 93 255',   p7:'18 72 199'  },
      techBlue: { name:'科技蓝', color:'#4080ff', p1:'232 240 255', p5:'90 155 255',  p6:'64 128 255',  p7:'50 100 200' },
      green:    { name:'生机绿', color:'#00b42a', p1:'235 255 239', p5:'0 210 50',    p6:'0 180 42',    p7:'0 140 33'   },
      cyan:     { name:'清新青', color:'#0fc6c2', p1:'228 254 253', p5:'40 215 212',  p6:'15 198 194',  p7:'11 153 150' },
      orange:   { name:'活力橙', color:'#ff7d00', p1:'255 247 232', p5:'255 158 0',   p6:'255 125 0',   p7:'200 95 0'   },
    }
    const themePresets = Object.entries(THEMES).map(([key, v]) => ({ key, ...v }))
    const themeKey = ref(localStorage.getItem('proto-theme-color') || 'blue')

    function applyTheme(key) {
      const t = THEMES[key]; if (!t) return
      themeKey.value = key
      const r = document.documentElement
      r.style.setProperty('--primary-1', t.p1)
      r.style.setProperty('--primary-5', t.p5)
      r.style.setProperty('--primary-6', t.p6)
      r.style.setProperty('--primary-7', t.p7)
      /* 同步覆盖 Arco Design --arcoblue-* 变量（按钮/标签/链接等组件跟随主题色变）*/
      r.style.setProperty('--arcoblue-1', t.p1)
      r.style.setProperty('--arcoblue-2', t.p1)
      r.style.setProperty('--arcoblue-3', t.p5)
      r.style.setProperty('--arcoblue-4', t.p5)
      r.style.setProperty('--arcoblue-5', t.p5)
      r.style.setProperty('--arcoblue-6', t.p6)
      r.style.setProperty('--arcoblue-7', t.p7)
      r.style.setProperty('--arcoblue-8', t.p7)
      r.style.setProperty('--color-primary', 'rgb(' + t.p6 + ')')
      localStorage.setItem('proto-theme-color', key)
    }
    applyTheme(themeKey.value)

    function setPageState(s) { pageState.value = s }

    const NAV_MAP = {
      dashboard: './dashboard.html', list: './list.html', 'form-add': './form-add.html',
      detail: './detail.html', 'list-filter': './list-filter.html', 'list-card': './list-card.html',
      'form-step': './form-step.html', profile: './profile.html', 'result-success': './result-success.html',
      'exception-404': './exception-404.html', 'user-role': './user-role.html',
      'permission-tree': './permission-tree.html', 'log-list': './log-list.html',
      'user-mgmt': './user-role.html', 'role-mgmt': './permission-tree.html',
      log: './log-list.html', help: './index.html',
      index: './index.html', login: './login.html'
    }
    function onMenuClick(key) {
      selectedKeys.value = [key]
      if (NAV_MAP[key]) window.location.href = NAV_MAP[key]
    }
    function onSubMenuClick(key, openedKeys) { openKeys.value = openedKeys }

    window.__protoApp = { pageState }
    return {
      collapsed, selectedKeys, openKeys, pageTitle, noticeCount, pageState,
      activeRole, roles, currentRole, permTree, checkedKeys,
      setPageState, onMenuClick, onSubMenuClick,
      isDark, toggleTheme,
      themePresets, themeKey, applyTheme
    }
  }
}).use(ArcoVue).mount('#app')
</script>
</body>
</html>
