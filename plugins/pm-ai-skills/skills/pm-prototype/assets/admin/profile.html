<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>个人中心 · 管理后台</title>
<link rel="stylesheet" href="../_shared/vendor/arco.css"/>
<link rel="stylesheet" href="../_shared/theme.css"/>
<style>
  [v-cloak] { display:none }
  .strength-bar { display:flex; gap:4px; margin-top:8px; }
  .strength-seg { height:4px; border-radius:2px; flex:1; background:#e5e6eb; }
  .strength-seg.active-weak   { background:#f53f3f; }
  .strength-seg.active-medium { background:#ff7d00; }
  .strength-seg.active-strong { background:#00b42a; }
  .strength-label { font-size:12px; margin-top:4px; }
  .strength-label.weak   { color:#f53f3f; }
  .strength-label.medium { color:#ff7d00; }
  .strength-label.strong { color:#00b42a; }
</style>
</head>
<body>
<div id="app" v-cloak>
  <!-- 左侧边栏 -->
  <aside class="pro-sider" :style="{ width: collapsed ? '48px' : '220px' }">
    <div class="pro-brand">
      <div class="pro-brand-icon">⚡</div>
      <span v-show="!collapsed" class="pro-brand-name">管理系统</span>
    </div>
    <a-menu
      :collapsed="collapsed"
      :selected-keys="selectedKeys"
      :open-keys="openKeys"
      @menu-item-click="onMenuClick"
      @sub-menu-click="onSubMenuClick"
      style="border:none;width:100%;flex:1"
    >
      <a-menu-item key="dashboard">
        <template #icon><icon-home></icon-home></template>
        <a href="./dashboard.html">数据概览</a>
      </a-menu-item>
      <a-sub-menu key="list-group">
        <template #icon><icon-apps></icon-apps></template>
        <template #title>业务管理</template>
        <a-menu-item key="list"><a href="./list.html">数据列表</a></a-menu-item>
        <a-menu-item key="form-add"><a href="./form-add.html">新增数据</a></a-menu-item>
        <a-menu-item key="detail"><a href="./detail.html">数据详情</a></a-menu-item>
      </a-sub-menu>
      <a-sub-menu key="system">
        <template #icon><icon-settings></icon-settings></template>
        <template #title>系统管理</template>
        <a-menu-item key="user-mgmt"><a href="./user-role.html">用户管理</a></a-menu-item>
        <a-menu-item key="role-mgmt"><a href="./permission-tree.html">角色权限</a></a-menu-item>
        <a-menu-item key="log"><a href="./log-list.html">操作日志</a></a-menu-item>
      </a-sub-menu>
      <a-menu-item key="help">
        <template #icon><icon-question-circle></icon-question-circle></template>
        帮助中心
      </a-menu-item>
    </a-menu>
  </aside>

  <!-- 顶部导航栏 -->
  <header class="pro-navbar" :style="{ left: collapsed ? '48px' : '220px' }">
    <div style="display:flex;align-items:center;gap:12px">
      <a-button type="text" style="color:var(--color-text-2)" @click="collapsed = !collapsed">
        <template #icon>
          <icon-menu-fold v-if="!collapsed"></icon-menu-fold>
          <icon-menu-unfold v-else></icon-menu-unfold>
        </template>
      </a-button>
      <a-breadcrumb>
        <a-breadcrumb-item>
          <a href="./dashboard.html" style="color:var(--color-text-3)">首页</a>
        </a-breadcrumb-item>
        <a-breadcrumb-item>{{ pageTitle }}</a-breadcrumb-item>
      </a-breadcrumb>
    </div>
    <div style="display:flex;align-items:center;gap:4px">
      <div style="display:flex;align-items:center;gap:8px;width:200px;height:32px;padding:0 12px;border:1px solid var(--proto-border);border-radius:20px;background:rgba(0,0,0,.04);color:var(--color-text-3);cursor:pointer;font-size:13px;margin-right:8px">
        <icon-search style="font-size:14px;flex-shrink:0"></icon-search>
        <span>搜索页面...</span>
      </div>
      <a-tooltip content="消息通知">
        <a-badge :count="noticeCount" :offset="[-2,4]">
          <a-button type="text" style="color:var(--color-text-2)">
            <template #icon><icon-notification style="font-size:18px"></icon-notification></template>
          </a-button>
        </a-badge>
      </a-tooltip>
      <a-tooltip content="全屏">
        <a-button type="text" style="color:var(--color-text-2)">
          <template #icon><icon-fullscreen style="font-size:18px"></icon-fullscreen></template>
        </a-button>
      </a-tooltip>
      <!-- 主题色选择 -->
      <div style="display:flex;align-items:center;gap:4px;padding:0 6px">
        <span
          v-for="t in themePresets" :key="t.key"
          :title="t.name"
          @click="applyTheme(t.key)"
          :style="{
            display:'inline-block', width:'14px', height:'14px',
            borderRadius:'50%', background:t.color, cursor:'pointer',
            boxShadow: themeKey===t.key ? '0 0 0 2px #fff,0 0 0 4px '+t.color : 'none',
            transition:'box-shadow .15s'
          }"
        ></span>
      </div>

      <a-tooltip :content="isDark ? '切换浅色' : '切换深色'">
        <a-button type="text" style="color:var(--color-text-2);font-size:16px;padding:0 8px;line-height:1" @click="toggleTheme">
          {{ isDark ? '☀️' : '🌙' }}
        </a-button>
      </a-tooltip>
      <a-divider direction="vertical" style="height:20px;margin:0 8px"></a-divider>
      <a-dropdown trigger="click">
        <div style="display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 8px;border-radius:6px;transition:.15s" onmouseenter="this.style.background='rgba(0,0,0,.04)'" onmouseleave="this.style.background=''">
          <a-avatar style="background:linear-gradient(135deg,#165dff,#7b61ff);font-size:14px" :size="32">管</a-avatar>
          <span style="font-size:14px;color:var(--color-text-1)">管理员</span>
          <icon-down style="font-size:12px;color:var(--color-text-3)"></icon-down>
        </div>
        <template #content>
          <a-doption>个人信息</a-doption>
          <a-doption>修改密码</a-doption>
          <a-doption disabled>系统设置</a-doption>
          <a-divider style="margin:4px 0"></a-divider>
          <a-doption><a href="./login.html" style="color:inherit">退出登录</a></a-doption>
        </template>
      </a-dropdown>
    </div>
  </header>

  <!-- 主内容区 -->
  <main class="pro-main" :style="{ marginLeft: collapsed ? '48px' : '220px' }">
    <div class="pro-content">

      <!-- loading 态 -->
      <div v-if="pageState === 'loading'" style="display:flex;align-items:center;justify-content:center;min-height:400px">
        <a-spin tip="加载中..." :size="32"></a-spin>
      </div>

      <!-- error 态 -->
      <a-result v-else-if="pageState === 'error'" status="500" title="加载失败" subtitle="请求数据时出现错误，请稍后重试" style="padding:80px 0">
        <template #extra>
          <a-button type="primary" @click="pageState='normal'">重新加载</a-button>
        </template>
      </a-result>

      <!-- empty 态 -->
      <a-card v-else-if="pageState === 'empty'" class="general-card" style="padding:60px 0;text-align:center">
        <a-empty description="暂无数据" style="padding:40px 0"></a-empty>
      </a-card>

      <!-- 正常内容 -->
      <template v-else>

        <!-- 个人信息横幅 -->
        <a-card class="general-card" :body-style="{ padding: '24px 32px' }" style="margin-bottom:16px">
          <div style="display:flex;align-items:center;justify-content:space-between">
            <div style="display:flex;align-items:center;gap:20px">
              <a-avatar :size="72" style="background:linear-gradient(135deg,#165dff,#7b61ff);font-size:28px;flex-shrink:0">管</a-avatar>
              <div>
                <div style="font-size:20px;font-weight:700;color:var(--color-text-1);margin-bottom:4px">管理员</div>
                <div style="font-size:13px;color:var(--color-text-3);margin-bottom:6px">
                  <a-tag color="arcoblue" size="small" style="margin-right:8px">超级管理员</a-tag>
                  技术部 · 高级工程师
                </div>
                <div style="font-size:12px;color:var(--color-text-4)">最后登录：2025-09-24 09:30:11 &nbsp;·&nbsp; IP: 192.168.1.100</div>
              </div>
            </div>
            <a-button type="outline">
              <template #icon><icon-edit></icon-edit></template>
              编辑资料
            </a-button>
          </div>
        </a-card>

        <!-- Tabs -->
        <a-card class="general-card" :body-style="{ padding: '0 24px 24px' }">
          <a-tabs default-active-key="info" type="line">

            <!-- 基本信息 -->
            <a-tab-pane key="info" title="基本信息">
              <div style="padding-top:20px;max-width:700px">
                <!-- 头像上传 -->
                <div style="margin-bottom:20px">
                  <div style="font-size:13px;color:var(--color-text-2);margin-bottom:8px">头像</div>
                  <a-upload list-type="picture-card" accept="image/*" :limit="1"></a-upload>
                </div>
                <a-form :model="profileForm" :label-col="{ span: 4 }" :wrapper-col="{ span: 16 }">
                  <a-form-item label="姓名">
                    <a-input v-model="profileForm.name"></a-input>
                  </a-form-item>
                  <a-form-item label="手机号">
                    <a-input v-model="profileForm.phone"></a-input>
                  </a-form-item>
                  <a-form-item label="邮箱">
                    <a-input v-model="profileForm.email"></a-input>
                  </a-form-item>
                  <a-form-item label="部门">
                    <a-input v-model="profileForm.dept" readonly></a-input>
                  </a-form-item>
                  <a-form-item label="职位">
                    <a-input v-model="profileForm.position"></a-input>
                  </a-form-item>
                  <a-form-item label="个人简介">
                    <a-textarea v-model="profileForm.bio" :auto-size="{ minRows: 3 }" placeholder="介绍一下自己..."></a-textarea>
                  </a-form-item>
                  <a-form-item :wrapper-col="{ offset: 4 }">
                    <a-button type="primary">保存修改</a-button>
                  </a-form-item>
                </a-form>
              </div>
            </a-tab-pane>

            <!-- 修改密码 -->
            <a-tab-pane key="password" title="修改密码">
              <div style="padding-top:20px;max-width:560px">
                <a-form :model="pwdForm" :label-col="{ span: 5 }" :wrapper-col="{ span: 14 }">
                  <a-form-item label="当前密码" required>
                    <a-input-password v-model="pwdForm.current" placeholder="请输入当前密码"></a-input-password>
                  </a-form-item>
                  <a-form-item label="新密码" required>
                    <a-input-password v-model="pwdForm.newPwd" placeholder="请输入新密码（8位以上）" @input="calcStrength"></a-input-password>
                    <!-- 密码强度 -->
                    <div v-if="pwdForm.newPwd" style="width:100%;margin-top:4px">
                      <div class="strength-bar">
                        <div class="strength-seg" :class="strength >= 1 ? 'active-' + strengthClass : ''"></div>
                        <div class="strength-seg" :class="strength >= 2 ? 'active-' + strengthClass : ''"></div>
                        <div class="strength-seg" :class="strength >= 3 ? 'active-' + strengthClass : ''"></div>
                      </div>
                      <div class="strength-label" :class="strengthClass">
                        密码强度：{{ strengthLabel }}
                      </div>
                    </div>
                  </a-form-item>
                  <a-form-item label="确认密码" required>
                    <a-input-password v-model="pwdForm.confirm" placeholder="请再次输入新密码"></a-input-password>
                  </a-form-item>
                  <a-form-item :wrapper-col="{ offset: 5 }">
                    <a-button type="primary">修改密码</a-button>
                  </a-form-item>
                </a-form>
              </div>
            </a-tab-pane>

            <!-- 操作记录 -->
            <a-tab-pane key="logs" title="操作记录">
              <div style="padding-top:16px">
                <a-table :data="opLogs" :bordered="false" :pagination="false">
                  <template #columns>
                    <a-table-column title="操作类型" data-index="type" :width="110">
                      <template #cell="{ record }">
                        <a-tag :color="record.color" size="small">{{ record.type }}</a-tag>
                      </template>
                    </a-table-column>
                    <a-table-column title="操作描述" data-index="desc"></a-table-column>
                    <a-table-column title="IP地址" data-index="ip" :width="140"></a-table-column>
                    <a-table-column title="设备" data-index="device" :width="160"></a-table-column>
                    <a-table-column title="时间" data-index="time" :width="170"></a-table-column>
                  </template>
                </a-table>
              </div>
            </a-tab-pane>

          </a-tabs>
        </a-card>

      </template>
    </div>
  </main>

  <!-- 原型调试工具条 -->
  <div class="proto-toolbar">
    <span class="proto-badge">PROTO</span>
    <span style="color:rgba(255,255,255,.5)">管理后台</span>
    <span class="proto-sep">·</span>
    <span>{{ pageTitle }}</span>
    <span class="proto-sep">|</span>
    <button @click="setPageState('loading')">⏳ 加载中</button>
    <button @click="setPageState('empty')">📭 空数据</button>
    <button @click="setPageState('error')">⚠️ 出错</button>
    <button @click="setPageState('normal')">✅ 正常</button>
    <span class="proto-sep">|</span>
    <span style="opacity:.4;font-size:11px">仅原型调试用</span>
  </div>
</div>

<script src="../_shared/vendor/vue.global.prod.js"></script>
<script src="../_shared/vendor/arco-vue.min.js"></script>
<script src="../_shared/proto-utils.js"></script>
<script>
const { createApp, ref, reactive, computed } = Vue

createApp({
  setup() {
    const collapsed    = ref(false)
    const selectedKeys = ref(['profile'])
    const openKeys     = ref([])
    const pageTitle    = ref('个人中心')
    const noticeCount  = ref(3)
    const pageState    = ref('normal')

    const profileForm = reactive({
      name: '管理员', phone: '138****6789', email: 'admin@example.com',
      dept: '技术部', position: '高级工程师', bio: '负责系统架构设计和核心模块开发。'
    })

    const pwdForm = reactive({ current: '', newPwd: '', confirm: '' })
    const strength = ref(0)
    const strengthClass = computed(() => strength.value === 1 ? 'weak' : strength.value === 2 ? 'medium' : 'strong')
    const strengthLabel = computed(() => strength.value === 1 ? '弱' : strength.value === 2 ? '中' : '强')

    function calcStrength() {
      const p = pwdForm.newPwd
      if (!p) { strength.value = 0; return }
      let s = 0
      if (p.length >= 6) s++
      if (p.length >= 10 || /[A-Z]/.test(p)) s++
      if (/[^a-zA-Z0-9]/.test(p) || (p.length >= 12 && /[0-9]/.test(p) && /[A-Z]/.test(p))) s++
      strength.value = Math.max(1, s)
    }

    const opLogs = ref([
      { type: '登录', color: 'blue',   desc: '用户登录系统', ip: '192.168.1.100', device: 'Chrome / Windows', time: '2025-09-24 09:30:11' },
      { type: '编辑', color: 'orange', desc: '修改了用户资料', ip: '192.168.1.100', device: 'Chrome / Windows', time: '2025-09-23 16:20:05' },
      { type: '新增', color: 'green',  desc: '新增了一条数据记录', ip: '192.168.1.100', device: 'Chrome / Windows', time: '2025-09-23 14:05:33' },
      { type: '导出', color: 'purple', desc: '导出了用户列表 Excel', ip: '192.168.1.101', device: 'Firefox / Mac', time: '2025-09-22 11:45:00' },
      { type: '删除', color: 'red',    desc: '删除了记录 #100023', ip: '192.168.1.100', device: 'Chrome / Windows', time: '2025-09-21 10:30:55' },
      { type: '登录', color: 'blue',   desc: '用户登录系统', ip: '192.168.1.100', device: 'Safari / iPhone', time: '2025-09-20 08:15:22' },
      { type: '编辑', color: 'orange', desc: '修改了系统配置项', ip: '192.168.1.100', device: 'Chrome / Windows', time: '2025-09-19 17:08:44' },
      { type: '新增', color: 'green',  desc: '新增角色"产品经理"', ip: '192.168.1.100', device: 'Chrome / Windows', time: '2025-09-18 09:22:10' },
      { type: '导出', color: 'purple', desc: '导出了操作日志', ip: '192.168.1.102', device: 'Edge / Windows', time: '2025-09-17 14:55:30' },
      { type: '编辑', color: 'orange', desc: '修改密码', ip: '192.168.1.100', device: 'Chrome / Windows', time: '2025-09-15 10:10:01' },
    ])

    const isDark = ref(localStorage.getItem('proto-theme') === 'dark')
    function toggleTheme() {
      isDark.value = !isDark.value
      if (isDark.value) {
        document.body.setAttribute('arco-theme', 'dark')
        localStorage.setItem('proto-theme', 'dark')
      } else {
        document.body.removeAttribute('arco-theme')
        localStorage.setItem('proto-theme', 'light')
      }
    }
    if (isDark.value) document.body.setAttribute('arco-theme', 'dark')

    const THEMES = {
      blue:     { name:'品牌蓝', color:'#165dff', p1:'233 241 255', p5:'61 126 255',  p6:'22 93 255',   p7:'18 72 199'  },
      techBlue: { name:'科技蓝', color:'#4080ff', p1:'232 240 255', p5:'90 155 255',  p6:'64 128 255',  p7:'50 100 200' },
      green:    { name:'生机绿', color:'#00b42a', p1:'235 255 239', p5:'0 210 50',    p6:'0 180 42',    p7:'0 140 33'   },
      cyan:     { name:'清新青', color:'#0fc6c2', p1:'228 254 253', p5:'40 215 212',  p6:'15 198 194',  p7:'11 153 150' },
      orange:   { name:'活力橙', color:'#ff7d00', p1:'255 247 232', p5:'255 158 0',   p6:'255 125 0',   p7:'200 95 0'   },
    }
    const themePresets = Object.entries(THEMES).map(([key, v]) => ({ key, ...v }))
    const themeKey = ref(localStorage.getItem('proto-theme-color') || 'blue')

    function applyTheme(key) {
      const t = THEMES[key]; if (!t) return
      themeKey.value = key
      const r = document.documentElement
      r.style.setProperty('--primary-1', t.p1)
      r.style.setProperty('--primary-5', t.p5)
      r.style.setProperty('--primary-6', t.p6)
      r.style.setProperty('--primary-7', t.p7)
      localStorage.setItem('proto-theme-color', key)
    }
    applyTheme(themeKey.value)

    function setPageState(s) { pageState.value = s }

    const NAV_MAP = {
      dashboard: './dashboard.html', list: './list.html', 'form-add': './form-add.html',
      detail: './detail.html', 'list-filter': './list-filter.html', 'list-card': './list-card.html',
      'form-step': './form-step.html', profile: './profile.html', 'result-success': './result-success.html',
      'exception-404': './exception-404.html', 'user-role': './user-role.html',
      'permission-tree': './permission-tree.html', 'log-list': './log-list.html',
      'user-mgmt': './user-role.html', 'role-mgmt': './permission-tree.html',
      log: './log-list.html', help: './index.html',
      index: './index.html', login: './login.html'
    }
    function onMenuClick(key) {
      selectedKeys.value = [key]
      if (NAV_MAP[key]) window.location.href = NAV_MAP[key]
    }
    function onSubMenuClick(key, openedKeys) { openKeys.value = openedKeys }

    window.__protoApp = { pageState }
    return {
      collapsed, selectedKeys, openKeys, pageTitle, noticeCount, pageState,
      profileForm, pwdForm, strength, strengthClass, strengthLabel, opLogs,
      calcStrength, setPageState, onMenuClick, onSubMenuClick
    }
  }
}).use(ArcoVue).mount('#app')
</script>
</body>
</html>
