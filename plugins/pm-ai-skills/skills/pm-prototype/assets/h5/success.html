<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>提交结果 · H5 原型</title>
<link rel="stylesheet" href="../_公共资源/vendor/arco.css"/>
<link rel="stylesheet" href="../_公共资源/theme.css"/>
<style>
  [v-cloak] { display:none }
  .success-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 24px 32px;
    text-align: center;
  }
  .success-emoji {
    font-size: 80px;
    line-height: 1;
    margin-bottom: 20px;
    animation: pop .4s ease-out;
  }
  @keyframes pop {
    0%   { transform: scale(.5); opacity: 0; }
    70%  { transform: scale(1.1); }
    100% { transform: scale(1); opacity: 1; }
  }
  .success-title {
    font-size: 22px;
    font-weight: 800;
    color: #1d2129;
    margin-bottom: 10px;
  }
  .success-subtitle {
    font-size: 14px;
    color: #86909c;
    line-height: 1.7;
    margin-bottom: 20px;
  }
  .success-ref-box {
    background: #f7f8fa;
    border-radius: 10px;
    padding: 14px 20px;
    margin-bottom: 32px;
    width: 100%;
    box-sizing: border-box;
  }
  .success-ref-label {
    font-size: 12px;
    color: #86909c;
    margin-bottom: 4px;
  }
  .success-ref-number {
    font-size: 20px;
    font-weight: 700;
    color: #165dff;
    letter-spacing: 2px;
  }
  .success-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
  }
</style>
</head>
<body class="h5-body">
<div id="app" v-cloak>
  <div class="h5-phone">

    <!-- 状态栏 -->
    <div class="h5-status">
      <span>9:41</span>
      <span>🔋</span>
    </div>

    <!-- 顶部导航 -->
    <div class="h5-navbar">
      <span class="h5-navbar-title">{{ pageTitle }}</span>
    </div>

    <!-- 内容区 -->
    <div class="h5-content">

      <!-- 成功主区域 -->
      <div class="success-center">
        <div class="success-emoji">✅</div>
        <div class="success-title">提交成功！</div>
        <div class="success-subtitle">
          您的内容已成功提交，<br>
          我们将在 1-3 个工作日内完成审核。
        </div>

        <!-- 参考编号 -->
        <div class="success-ref-box">
          <div class="success-ref-label">参考编号</div>
          <div class="success-ref-number">{{ refNumber }}</div>
        </div>

        <!-- 操作按钮 -->
        <div class="success-actions">
          <a-button type="primary" long href="./home.html">返回首页</a-button>
          <a-button long href="./detail.html">查看详情</a-button>
        </div>
      </div>

      <!-- 提示信息 -->
      <div class="h5-section">
        <div class="h5-section-title">后续流程</div>
        <div class="h5-cell">
          <div class="h5-cell-icon">1️⃣</div>
          <div class="h5-cell-body">
            <div class="h5-cell-title">等待审核</div>
            <div class="h5-cell-desc">审核员将在 1 个工作日内查看</div>
          </div>
        </div>
        <div class="h5-cell">
          <div class="h5-cell-icon">2️⃣</div>
          <div class="h5-cell-body">
            <div class="h5-cell-title">通知确认</div>
            <div class="h5-cell-desc">审核结果将通过消息推送通知您</div>
          </div>
        </div>
        <div class="h5-cell">
          <div class="h5-cell-icon">3️⃣</div>
          <div class="h5-cell-body">
            <div class="h5-cell-title">正式生效</div>
            <div class="h5-cell-desc">审核通过后内容正式发布</div>
          </div>
        </div>
      </div>

      <!-- 底部占位 -->
      <div style="height:20px;"></div>
    </div>

    <!-- Proto 调试条 -->
    <div class="proto-toolbar">
      <span class="proto-badge">PROTO</span>
      <span style="color:rgba(255,255,255,.5)">H5 移动端</span>
      <span class="proto-sep">·</span>
      <span>{{ pageTitle }}</span>
    </div>

  </div>
</div>

<script src="../_公共资源/vendor/vue.global.prod.js"></script>
<script src="../_公共资源/vendor/arco-vue.min.js"></script>
<script src="../_公共资源/proto-utils.js"></script>
<script>
const { createApp, ref } = Vue
createApp({
  setup() {
    const pageTitle = ref('提交结果')

    // 生成参考编号（原型演示用固定值）
    const refNumber = ref('REF-2024-' + Math.floor(Math.random() * 9000 + 1000))

    return { pageTitle, refNumber }
  }
}).use(ArcoVue).mount('#app')
</script>
</body>
</html>
