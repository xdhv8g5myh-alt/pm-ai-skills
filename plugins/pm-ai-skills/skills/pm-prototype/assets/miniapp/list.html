<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>发现 — 小程序原型</title>
  <link rel="stylesheet" href="../_公共资源/vendor/arco.css" />
  <link rel="stylesheet" href="../_公共资源/vendor/fontawesome/css/fontawesome.min.css"/>
  <link rel="stylesheet" href="../_公共资源/theme.css" />
  <style>
    [v-cloak] { display: none }
    body { margin: 0; background: #e8e8e8; display: flex; justify-content: center; align-items: flex-start; padding: 24px 0 80px; min-height: 100vh; }
    .mp-shell {
      width: 375px; min-height: 700px; background: #fff;
      border-radius: 40px; overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,.25), 0 0 0 2px #d0d0d0;
      display: flex; flex-direction: column; position: relative;
    }
    .mp-statusbar {
      height: 44px; background: #000; color: #fff;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; font-size: 13px; flex-shrink: 0;
    }
    .mp-navbar {
      height: 44px; background: #fff; border-bottom: 1px solid #f0f0f0;
      display: flex; align-items: center; justify-content: center;
      position: relative; flex-shrink: 0;
    }
    .mp-navbar-back { position: absolute; left: 12px; font-size: 20px; color: #333; cursor: pointer; padding: 8px; }
    .mp-navbar-title { font-size: 16px; font-weight: 600; color: #191919; }
    .mp-navbar-more { position: absolute; right: 12px; font-size: 20px; color: #333; cursor: pointer; padding: 8px; }
    .mp-content { flex: 1; overflow-y: auto; background: #f7f8fa; }
    .mp-tabbar {
      height: 56px; background: #fff; border-top: 1px solid #e8e8e8;
      display: flex; flex-shrink: 0;
    }
    .mp-tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; text-decoration: none; }
    .mp-tab-icon { font-size: 22px; line-height: 1; }
    .mp-tab-label { font-size: 10px; color: #999; }
    .mp-tab.active .mp-tab-label { color: #07c160; }
    .mp-section { background: #fff; border-radius: 10px; margin: 10px; overflow: hidden; }
    .mp-section-title { font-size: 14px; font-weight: 600; color: #333; padding: 14px 16px 8px; }
    .mp-cell { display: flex; align-items: center; padding: 14px 16px; border-bottom: 1px solid #f5f5f5; gap: 12px; }
    .mp-cell:last-child { border-bottom: none; }
    .mp-cell-icon { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .mp-cell-body { flex: 1; min-width: 0; }
    .mp-cell-title { font-size: 14px; color: #191919; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mp-cell-desc { font-size: 12px; color: #999; margin-top: 2px; }
    .mp-cell-right { font-size: 13px; color: #bbb; flex-shrink: 0; }
    .mp-tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; }
    .mp-tag-green { background: #e8f7ee; color: #07c160; }
    .mp-tag-blue { background: #e8f3ff; color: #1677ff; }
    .mp-tag-orange { background: #fff3e8; color: #ff7d00; }
    .mp-tag-gray { background: #f2f3f5; color: #86909c; }
    .mp-tag-red { background: #ffe8e8; color: #f53f3f; }
    /* 搜索栏 */
    .mp-search-bar {
      background: #fff;
      padding: 10px 12px;
      flex-shrink: 0;
    }
    .mp-search-inner {
      background: #f7f8fa;
      border-radius: 20px;
      display: flex;
      align-items: center;
      padding: 8px 14px;
      gap: 8px;
    }
    .mp-search-icon { color: #c0c4cc; font-size: 16px; }
    .mp-search-input {
      border: none; outline: none; background: transparent;
      font-size: 14px; color: #191919; flex: 1;
    }
    .mp-search-input::placeholder { color: #c0c4cc; }
    /* 分类 Tab */
    .mp-cattab {
      background: #fff;
      display: flex;
      overflow-x: auto;
      padding: 0 12px;
      border-bottom: 1px solid #f0f0f0;
      flex-shrink: 0;
      scrollbar-width: none;
    }
    .mp-cattab::-webkit-scrollbar { display: none; }
    .mp-cattab-item {
      padding: 10px 14px;
      font-size: 14px;
      color: #666;
      cursor: pointer;
      white-space: nowrap;
      position: relative;
      flex-shrink: 0;
    }
    .mp-cattab-item.active {
      color: #07c160;
      font-weight: 600;
    }
    .mp-cattab-item.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 2px;
      background: #07c160;
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <div id="app" v-cloak>
    <div class="mp-shell">
      <!-- 状态栏 -->
      <div class="mp-statusbar">
        <span>9:41</span>
        <span style="display:flex;align-items:center;gap:4px;font-size:12px">
          <span>●●●</span><span>WiFi</span><span>🔋</span>
        </span>
      </div>

      <!-- 导航栏 -->
      <div class="mp-navbar">
        <span class="mp-navbar-title">发现</span>
        <span class="mp-navbar-more" style="font-size:18px">⊞</span>
      </div>

      <!-- 搜索栏 -->
      <div class="mp-search-bar">
        <div class="mp-search-inner">
          <span class="mp-search-icon"><span class="fas fa-magnifying-glass"></span></span>
          <input class="mp-search-input" v-model="keyword" placeholder="搜索需求、原型、文档..." />
          <span v-if="keyword" @click="keyword=''" style="color:#c0c4cc;cursor:pointer;font-size:16px">✕</span>
        </div>
      </div>

      <!-- 分类 Tab -->
      <div class="mp-cattab">
        <div
          class="mp-cattab-item"
          :class="{active: activeCategory===cat.key}"
          v-for="cat in categories"
          :key="cat.key"
          @click="activeCategory=cat.key"
        >{{ cat.label }}</div>
      </div>

      <!-- 内容区 -->
      <div class="mp-content">
        <!-- loading 态 -->
        <div v-if="pageState==='loading'" style="display:flex;justify-content:center;align-items:center;height:300px">
          <a-spin tip="加载中..." size="large"></a-spin>
        </div>

        <!-- empty 态 -->
        <div v-else-if="pageState==='empty'" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:300px;color:#bbb;gap:12px">
          <div style="font-size:48px">📭</div>
          <div style="font-size:14px">暂无相关内容</div>
          <div style="font-size:12px;color:#ccc">换个分类或关键词试试</div>
        </div>

        <!-- error 态 -->
        <div v-else-if="pageState==='error'" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:300px;color:#bbb;gap:12px">
          <div style="font-size:48px"><span class="fas fa-triangle-exclamation"></span></div>
          <div style="font-size:14px;color:#f53f3f">加载失败，请检查网络</div>
          <a-button type="primary" size="small" @click="pageState='normal'" style="background:#07c160;border-color:#07c160">点击重试</a-button>
        </div>

        <!-- normal 态 -->
        <div v-else>
          <div class="mp-section" style="margin-top:10px">
            <a
              href="./detail.html"
              class="mp-cell"
              style="text-decoration:none"
              v-for="item in filteredList"
              :key="item.id"
            >
              <div class="mp-cell-icon" :style="{background: item.iconBg}">{{ item.icon }}</div>
              <div class="mp-cell-body">
                <div class="mp-cell-title">{{ item.title }}</div>
                <div class="mp-cell-desc" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px">
                  <span class="mp-tag" :class="item.tagClass">{{ item.tag }}</span>
                  <span>{{ item.author }} · {{ item.project }}</span>
                </div>
                <div style="font-size:11px;color:#bbb;margin-top:3px">{{ item.time }}</div>
              </div>
              <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
                <span class="mp-tag" :class="item.statusClass">{{ item.status }}</span>
                <div class="mp-cell-right">›</div>
              </div>
            </a>
          </div>

          <div v-if="filteredList.length===0" style="display:flex;flex-direction:column;align-items:center;padding:40px 0;color:#bbb;gap:8px">
            <div style="font-size:40px"><span class="fas fa-magnifying-glass"></span></div>
            <div style="font-size:14px">未找到匹配内容</div>
          </div>

          <div style="height:16px"></div>
        </div>
      </div>

      <!-- TabBar -->
      <div class="mp-tabbar">
        <a href="./home.html" class="mp-tab">
          <div class="mp-tab-icon">🏠</div>
          <div class="mp-tab-label">首页</div>
        </a>
        <a href="./list.html" class="mp-tab active">
          <div class="mp-tab-icon"><span class="fas fa-compass"></span></div>
          <div class="mp-tab-label" style="color:#07c160">发现</div>
        </a>
        <a href="./form.html" class="mp-tab">
          <div class="mp-tab-icon"><span class="fas fa-pen"></span></div>
          <div class="mp-tab-label">发布</div>
        </a>
        <a href="#" class="mp-tab">
          <div class="mp-tab-icon"><span class="fas fa-user"></span></div>
          <div class="mp-tab-label">我的</div>
        </a>
      </div>
    </div>

    <!-- Proto Toolbar -->
    <div class="proto-toolbar">
      <span class="proto-badge">PROTO</span>
      <span style="color:rgba(255,255,255,.5)">小程序</span>
      <span class="proto-sep">·</span>
      <span>{{ pageTitle }}</span>
      <span class="proto-sep">|</span>
      <button @click="pageState='loading'">⏳</button>
      <button @click="pageState='empty'">📭</button>
      <button @click="pageState='error'"><span class="fas fa-triangle-exclamation"></span></button>
      <button @click="pageState='normal'"><span class="fas fa-check"></span></button>
    </div>
  </div>

  <script src="../_公共资源/vendor/vue.global.prod.js"></script>
  <script src="../_公共资源/vendor/arco-vue.min.js"></script>
  <script src="../_公共资源/proto-utils.js"></script>
  <script>
    const { createApp, ref, computed } = Vue
    createApp({
      setup() {
        const pageTitle = ref('发现')
        const activeTab = ref('list')
        const pageState = ref('normal')
        const keyword = ref('')
        const activeCategory = ref('all')

        const categories = ref([
          { key: 'all', label: '全部' },
          { key: 'req', label: '需求' },
          { key: 'proto', label: '原型' },
          { key: 'doc', label: '文档' },
          { key: 'delivery', label: '交付' },
        ])

        const allItems = ref([
          { id:1, icon: '✏️', iconBg:'#e8f7ee', title:'用户中心改版 v2.0 完整需求说明', tag:'需求', tagClass:'mp-tag-green', author:'张明华', project:'电商改版', time:'10分钟前', status:'评审中', statusClass:'mp-tag-orange', category:'req' },
          { id:2, icon:'🖼️', iconBg:'#e8f3ff', title:'登录注册流程原型高保真稿', tag:'原型', tagClass:'mp-tag-blue', author:'李晓雨', project:'电商改版', time:'1小时前', status:'已完成', statusClass:'mp-tag-green', category:'proto' },
          { id:3, icon: '🚀', iconBg:'#fff3e8', title:'支付模块集成测试报告', tag:'交付', tagClass:'mp-tag-orange', author:'陈伟明', project:'支付优化', time:'3小时前', status:'测试中', statusClass:'mp-tag-blue', category:'delivery' },
          { id:4, icon:'📄', iconBg:'#f2f3f5', title:'前端组件库使用规范文档', tag:'文档', tagClass:'mp-tag-gray', author:'王芳', project:'基础建设', time:'昨天', status:'已发布', statusClass:'mp-tag-green', category:'doc' },
          { id:5, icon: '✏️', iconBg:'#e8f7ee', title:'搜索优化需求 — 关键词联想功能', tag:'需求', tagClass:'mp-tag-green', author:'刘思琪', project:'搜索优化', time:'昨天', status:'待评审', statusClass:'mp-tag-gray', category:'req' },
          { id:6, icon:'🖼️', iconBg:'#e8f3ff', title:'商品详情页 3.0 交互稿', tag:'原型', tagClass:'mp-tag-blue', author:'赵云', project:'电商改版', time:'2天前', status:'修改中', statusClass:'mp-tag-orange', category:'proto' },
          { id:7, icon:'📄', iconBg:'#f2f3f5', title:'接口文档 v4.1 — 用户服务', tag:'文档', tagClass:'mp-tag-gray', author:'孙小林', project:'用户中心', time:'3天前', status:'已发布', statusClass:'mp-tag-green', category:'doc' },
          { id:8, icon: '🚀', iconBg:'#fff3e8', title:'H5 落地页上线部署记录', tag:'交付', tagClass:'mp-tag-orange', author:'周佳', project:'营销活动', time:'上周', status:'已上线', statusClass:'mp-tag-blue', category:'delivery' },
        ])

        const filteredList = computed(() => {
          return allItems.value.filter(item => {
            const matchCat = activeCategory.value === 'all' || item.category === activeCategory.value
            const matchKw = !keyword.value || item.title.includes(keyword.value) || item.author.includes(keyword.value)
            return matchCat && matchKw
          })
        })

        return { pageTitle, activeTab, pageState, keyword, activeCategory, categories, allItems, filteredList }
      }
    }).use(ArcoVue).mount('#app')
  </script>
</body>
</html>
