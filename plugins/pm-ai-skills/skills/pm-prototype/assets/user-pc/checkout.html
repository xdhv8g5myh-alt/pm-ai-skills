<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VibePM — 结算确认</title>
  <link rel="stylesheet" href="../_公共资源/vendor/arco.css" />
  <link rel="stylesheet" href="../_公共资源/theme.css" />
  <style>
    [v-cloak] { display: none }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif; }
    .pc-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: 64px; background: #fff; border-bottom: 1px solid #e5e6eb;
      display: flex; align-items: center; padding: 0 40px; gap: 24px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .pc-logo { font-size: 20px; font-weight: 700; color: var(--color-primary,#165dff); margin-right: 16px; white-space: nowrap; }
    .pc-nav { display: flex; align-items: center; gap: 4px; flex: 1; }
    .pc-nav-item { padding: 6px 14px; border-radius: 6px; font-size: 14px; color: #4e5969; cursor: pointer; text-decoration: none; transition: .15s; }
    .pc-nav-item:hover, .pc-nav-item.active { color: var(--color-primary,#165dff); background: rgba(22,93,255,.06); }
    .pc-header-right { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    .pc-main { min-height: 100vh; padding-top: 64px; background: #f5f5f5; }
    .pc-footer { background: #1d2129; color: rgba(255,255,255,.6); text-align: center; padding: 24px; font-size: 13px; }

    /* Checkout layout */
    .checkout-wrap { max-width: 1100px; margin: 0 auto; padding: 32px 24px; display: flex; gap: 24px; align-items: flex-start; }
    .checkout-main { flex: 1; min-width: 0; }
    .checkout-aside { width: 360px; flex-shrink: 0; }

    /* Steps */
    .steps-card { background: #fff; border-radius: 10px; padding: 28px 32px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }

    /* Form card */
    .form-card { background: #fff; border-radius: 10px; padding: 28px 32px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
    .form-card-title { font-size: 17px; font-weight: 600; color: #1d2129; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid #f2f3f5; }

    /* Order summary */
    .summary-card { background: #fff; border-radius: 10px; padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,.06); margin-bottom: 16px; }
    .summary-title { font-size: 16px; font-weight: 600; color: #1d2129; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #f2f3f5; }
    .summary-service { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid #f2f3f5; margin-bottom: 4px; }
    .summary-service-icon { width: 48px; height: 48px; border-radius: 8px; background: linear-gradient(135deg,#165dff,#7b61ff); display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
    .summary-service-info { flex: 1; }
    .summary-service-name { font-size: 14px; font-weight: 600; color: #1d2129; margin-bottom: 3px; }
    .summary-service-plan { font-size: 12px; color: #86909c; }
    .summary-service-price { font-size: 16px; font-weight: 700; color: #165dff; }
    .summary-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; font-size: 13px; }
    .summary-row-label { color: #86909c; }
    .summary-row-val { color: #1d2129; }
    .summary-total { display: flex; justify-content: space-between; align-items: center; padding: 14px 0 0; margin-top: 4px; border-top: 2px solid #f2f3f5; }
    .summary-total-label { font-size: 15px; font-weight: 600; color: #1d2129; }
    .summary-total-val { font-size: 24px; font-weight: 700; color: #165dff; }

    /* Success overlay */
    .success-overlay { text-align: center; padding: 64px 24px; }
  </style>
</head>
<body>
  <div id="app" v-cloak>
    <!-- Header -->
    <header class="pc-header">
      <div class="pc-logo">⚡ VibePM</div>
      <nav class="pc-nav">
        <a href="./home.html" class="pc-nav-item" :class="{active:activePage==='home'}">首页</a>
        <a href="./list.html" class="pc-nav-item" :class="{active:activePage==='list'}">发现</a>
        <a href="./detail.html" class="pc-nav-item" :class="{active:activePage==='detail'}">详情</a>
        <a href="./checkout.html" class="pc-nav-item" :class="{active:activePage==='checkout'}">结算</a>
      </nav>
      <div class="pc-header-right">
        <a-input-search placeholder="搜索..." style="width:200px"></a-input-search>
        <a-button type="text">
          <template #icon><icon-notification></icon-notification></template>
        </a-button>
        <a href="./profile.html">
          <a-avatar style="background:linear-gradient(135deg,#165dff,#7b61ff);cursor:pointer" :size="32">U</a-avatar>
        </a>
      </div>
    </header>

    <main class="pc-main">
      <!-- Success state -->
      <template v-if="submitted">
        <div class="success-overlay">
          <a-result status="success" title="订单提交成功！" subtitle="感谢您的选择，我们将在 1 个工作日内联系您。">
            <template #extra>
              <a-space>
                <a-button type="primary" @click="$window.location.href='./home.html'">返回首页</a-button>
                <a-button @click="submitted=false">再次确认</a-button>
              </a-space>
            </template>
          </a-result>
        </div>
      </template>

      <template v-else>
        <div class="checkout-wrap">
          <!-- Left: Steps + Form -->
          <div class="checkout-main">
            <!-- Steps -->
            <div class="steps-card">
              <a-steps :current="currentStep" size="small">
                <a-step title="选择服务" description="选择所需套餐"></a-step>
                <a-step title="确认信息" description="填写联系信息"></a-step>
                <a-step title="完成提交" description="等待确认"></a-step>
              </a-steps>
            </div>

            <!-- Form -->
            <div class="form-card">
              <div class="form-card-title">
                <icon-user style="margin-right:8px;color:#165dff"></icon-user>
                填写联系信息
              </div>
              <a-form :model="form" layout="vertical">
                <a-row :gutter="16">
                  <a-col :span="12">
                    <a-form-item label="姓名" required field="name">
                      <a-input v-model="form.name" placeholder="请输入真实姓名" allow-clear></a-input>
                    </a-form-item>
                  </a-col>
                  <a-col :span="12">
                    <a-form-item label="手机号码" required field="phone">
                      <a-input v-model="form.phone" placeholder="请输入手机号码" allow-clear></a-input>
                    </a-form-item>
                  </a-col>
                </a-row>
                <a-form-item label="邮箱地址" required field="email">
                  <a-input v-model="form.email" placeholder="请输入邮箱地址，用于接收通知" allow-clear>
                    <template #prefix><icon-email></icon-email></template>
                  </a-input>
                </a-form-item>
                <a-form-item label="所在组织 / 公司" field="org">
                  <a-input v-model="form.org" placeholder="请输入公司或组织名称（可选）" allow-clear></a-input>
                </a-form-item>
                <a-form-item label="职位" field="role">
                  <a-select v-model="form.role" placeholder="请选择您的职位" allow-clear>
                    <a-option value="pm">产品经理</a-option>
                    <a-option value="designer">设计师</a-option>
                    <a-option value="dev">开发工程师</a-option>
                    <a-option value="ops">运营</a-option>
                    <a-option value="ceo">CEO / 创始人</a-option>
                    <a-option value="other">其他</a-option>
                  </a-select>
                </a-form-item>
                <a-form-item label="需求备注" field="remark">
                  <a-textarea
                    v-model="form.remark"
                    placeholder="请描述您的具体需求或期望，方便我们更好地为您服务..."
                    :auto-size="{minRows:4, maxRows:8}"
                  ></a-textarea>
                </a-form-item>

                <!-- Agreement -->
                <a-form-item style="margin-bottom:0">
                  <a-checkbox v-model="form.agreed">
                    我已阅读并同意
                    <a href="#" style="color:#165dff">《服务协议》</a>
                    和
                    <a href="#" style="color:#165dff">《隐私政策》</a>
                  </a-checkbox>
                </a-form-item>
              </a-form>
            </div>
          </div>

          <!-- Right: Order Summary -->
          <div class="checkout-aside">
            <div class="summary-card">
              <div class="summary-title">订单摘要</div>

              <!-- Service item -->
              <div class="summary-service">
                <div class="summary-service-icon">🚀</div>
                <div class="summary-service-info">
                  <div class="summary-service-name">VibePM 专业版</div>
                  <div class="summary-service-plan">年付套餐 · 最多 10 个席位</div>
                </div>
                <div class="summary-service-price">¥9,800</div>
              </div>

              <!-- Detail rows -->
              <div class="summary-row">
                <span class="summary-row-label">原价</span>
                <span class="summary-row-val" style="text-decoration:line-through;color:#86909c">¥12,000</span>
              </div>
              <div class="summary-row">
                <span class="summary-row-label">年付优惠</span>
                <span class="summary-row-val" style="color:#00b42a">-¥2,200</span>
              </div>
              <div class="summary-row">
                <span class="summary-row-label">新用户折扣</span>
                <span class="summary-row-val" style="color:#00b42a">-¥0</span>
              </div>
              <div class="summary-row">
                <span class="summary-row-label">增值服务</span>
                <span class="summary-row-val">AI 额度加量包 × 1</span>
              </div>
              <div class="summary-row">
                <span class="summary-row-label">AI 加量包</span>
                <span class="summary-row-val">¥500</span>
              </div>

              <div class="summary-total">
                <span class="summary-total-label">合计</span>
                <span class="summary-total-val">¥10,300</span>
              </div>
            </div>

            <!-- Plan features -->
            <div class="summary-card">
              <div class="summary-title">专业版包含</div>
              <div v-for="f in planFeatures" :key="f" style="display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;color:#4e5969">
                <icon-check-circle-fill style="color:#00b42a;flex-shrink:0"></icon-check-circle-fill>
                {{ f }}
              </div>
            </div>

            <!-- Submit -->
            <a-button
              type="primary"
              long
              size="large"
              :disabled="!form.agreed || !form.name || !form.email"
              @click="submitted=true"
              style="height:48px;font-size:16px;font-weight:600"
            >
              确认提交订单
            </a-button>
            <div style="text-align:center;font-size:12px;color:#86909c;margin-top:10px">
              提交后，销售顾问将在 1 个工作日内与您联系
            </div>
          </div>
        </div>
      </template>
    </main>

    <footer class="pc-footer">© 2025 VibePM · 智能产品协作平台 · 用户前台原型</footer>

    <div class="proto-toolbar">
      <span class="proto-badge">PROTO</span>
      <span style="color:rgba(255,255,255,.5)">用户前台 PC</span>
      <span class="proto-sep">·</span>
      <span>{{ pageTitle }}</span>
      <span class="proto-sep">|</span>
      <button @click="pageState='loading'">⏳ 加载中</button>
      <button @click="pageState='empty'">📭 空数据</button>
      <button @click="pageState='error'">⚠️ 出错</button>
      <button @click="pageState='normal'">✅ 正常</button>
    </div>
  </div>

  <script src="../_公共资源/vendor/vue.global.prod.js"></script>
  <script src="../_公共资源/vendor/arco-vue.min.js"></script>
  <script src="../_公共资源/proto-utils.js"></script>
  <script>
    const { createApp, ref, reactive } = Vue
    createApp({
      setup() {
        const pageTitle = ref('结算确认')
        const activePage = ref('checkout')
        const pageState = ref('normal')
        const currentStep = ref(1)
        const submitted = ref(false)

        const form = reactive({
          name: '',
          phone: '',
          email: '',
          org: '',
          role: null,
          remark: '',
          agreed: false
        })

        const planFeatures = ref([
          '最多 10 个席位',
          'AI 需求分析（无限次）',
          '原型生成（无限次）',
          'PRD 自动生成',
          '前端代码导出',
          '优先技术支持',
          '自定义品牌 Logo',
          '数据导出与备份',
          'SSO 单点登录',
          '专属客户成功经理'
        ])

        return { pageTitle, activePage, pageState, currentStep, submitted, form, planFeatures }
      }
    }).use(ArcoVue).mount('#app')
  </script>
</body>
</html>
